<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Egg Game</title>
    <link rel="icon" href="./images/hen-right.png">

    <!-- social media -->

    <meta property="og:title" content="Game">
    <meta property="og:description"
        content="A simple interactive game built using HTML, CSS, sass  and JavaScript. It focuses on creating a clean and responsive interface while using JavaScript to handle user interactions and dynamic functionality.">
    <meta property="og:url" content="https://malakkorashy23-source.github.io/Game/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Game">

    <!-- link of icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!--____________________________________ links of css ____________________________________-->

    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">

</head>

<body>
    
    <header id="Game">
        <nav class="py-3">
            <div class="container">
                <h5 class="text-center text-light mb-0">
                    Score : <span class="score">0</span> |
                    <span class="text-danger">Life Score </span>: <span id="LifeScore">5</span> |
                    Highest Score : <span id="HighestScore">0</span> |
                    Use mouse to control
                </h5>
            </div>
        </nav>

        <div class="chickenContainer mt-3">
            <div class="container">
                <div class="row">
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <i class="fa-solid fa-egg egg text-light"></i>
                            <img src="./images/hen-right.png" class="img-fluid" alt="hen">
                        </div>
                    </div>
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <i class="fa-solid fa-egg egg text-light"></i>
                            <img src="./images/hen-right.png" class="img-fluid" alt="hen">
                        </div>
                    </div>
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <i class="fa-solid fa-egg egg text-light"></i>
                            <img src="./images/hen-right.png" class="img-fluid" alt="hen">
                        </div>
                    </div>
                </div>

            </div>
            <div class="line"></div>
        </div>

        <div class="brokenEggs mt-3">
            <div class="container">
                <div class="row">
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <img src="./images/brokenEgg.png" class="img-fluid brokenEgg" alt="hen">
                        </div>
                    </div>
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <img src="./images/brokenEgg.png" class="img-fluid brokenEgg" alt="hen">
                        </div>
                    </div>
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <div class="item">
                            <img src="./images/brokenEgg.png" class="img-fluid brokenEgg" alt="hen">
                        </div>
                    </div>
                </div>

            </div>
            <div class="line"></div>
        </div>

        <div class="basket">
            <img src="./images/basket2.png" class="img-fluid" alt="">
            <span class="score text-light">0</span>
        </div>

        <div class="start bg-success">
            <h3 class="mb-0"> Start Game</h3>
        </div>

        <div class="bg-bottom">
            <img src="./images/Easter-Eggs.png" class="img-fluid" alt="">
        </div>
    </header>

    <!--____________________________________ links of js ____________________________________-->

    <script src="./js/bootstrap.js"></script>
    <script src="./js/jQuery.js"></script>
    <script src="./js/function.js"></script>
    <script src="./js/index.js"></script>

</body>

</html>
